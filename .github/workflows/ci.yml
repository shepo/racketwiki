name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate:seed
      - run: npm run build
      - run: npx tsc -p studio/tsconfig.json
      - run: npx sanity schema validate
        working-directory: studio
      - run: npx tsc -p worker/tsconfig.json
